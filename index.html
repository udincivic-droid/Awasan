<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Awasan PMK Batu Pahat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Laporan Awasan</h1>
                <p class="text-xs text-blue-200">PMK Batu Pahat</p>
            </div>
            <div id="clock" class="text-xs bg-blue-800 px-3 py-1.5 rounded-full border border-blue-700"></div>
        </div>
    </header>

    <!-- Navigasi Tab -->
    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-[65px] z-40">
        <div class="max-w-3xl mx-auto flex">
            <button onclick="switchTab('form')" id="nav-form" class="flex-1 py-3 text-center font-medium text-sm border-b-2 border-blue-600 text-blue-600 transition">
                <i class="fa-solid fa-pen-to-square mr-1"></i> Isi Laporan
            </button>
            <button onclick="switchTab('list')" id="nav-list" class="flex-1 py-3 text-center font-medium text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition">
                <i class="fa-solid fa-folder-open mr-1"></i> Semak Rekod <span id="badge-count" class="ml-1 bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </nav>

    <!-- Kandungan Utama -->
    <main class="max-w-3xl mx-auto p-4 mb-12">

        <!-- TAB 1: BORANG LAPORAN -->
        <section id="section-form" class="space-y-4">
            <form id="reportForm" onsubmit="handleFormSubmit(event)" class="bg-white rounded-xl shadow-sm p-5 border border-slate-200 space-y-4">
                
                <!-- Tarikh & Masa -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tarikh & Masa</label>
                    <input type="datetime-local" id="datetime" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- No Pegawai -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">No Pegawai</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-id-badge"></i></span>
                        <input type="text" id="officerId" placeholder="cth: BP/1042" required class="w-full bg-slate-50 border border-slate-300 rounded-lg pl-10 pr-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <!-- Laporan / Pemerhatian -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Laporan / Pemerhatian / Catatan / Pemeriksaan</label>
                    <textarea id="observation" rows="4" placeholder="Masukkan butiran pemeriksaan di sini..." required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>

                <!-- Bukti Bergambar -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Bukti Bergambar</label>
                    <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageUpload(event)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                    <div id="imagePreviewContainer" class="grid grid-cols-3 gap-2 mt-3"></div>
                </div>

                <!-- Tandatangan Pegawai -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tandatangan Pegawai</label>
                    <div class="border border-slate-300 rounded-lg bg-slate-50 overflow-hidden relative">
                        <canvas id="sigCanvas" class="w-full h-40 cursor-crosshair touch-none"></canvas>
                        <button type="button" onclick="clearSignature()" class="absolute bottom-2 right-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-2.5 py-1 rounded transition">Padam Tanda Tangan</button>
                    </div>
                </div>

                <!-- Butang Tindakan -->
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="resetForm()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 rounded-lg text-sm transition">Isi Semula</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm shadow-md transition">Hantar Laporan</button>
                </div>
            </form>
        </section>

        <!-- TAB 2: SEMAK & CARIAN LAPORAN -->
        <section id="section-list" class="hidden space-y-4">
            <!-- Kotak Carian -->
            <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200 flex gap-2">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" id="searchInput" oninput="filterReports()" placeholder="Cari ikut No Pegawai atau Tarikh..." class="w-full bg-slate-50 border border-slate-300 rounded-lg pl-10 pr-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <!-- Senarai Rekod -->
            <div id="reportsContainer" class="space-y-3">
                <!-- Senarai akan dimasukkan melalui JavaScript -->
            </div>
        </section>

    </main>

    <!-- Modal Paparan Terperinci -->
    <div id="detailModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-blue-900">Maklumat Terperinci Laporan</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="modalContent" class="space-y-3 text-sm">
                <!-- Kandungan detail -->
            </div>
            <div class="flex justify-end gap-2 pt-3 border-t">
                <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900"><i class="fa-solid fa-print mr-1"></i> Cetak / PDF</button>
                <button onclick="closeModal()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-300">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Script Logik Aplikasi -->
    <script>
        // Jam Semasa di Header
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleString('ms-MY', { dateStyle: 'medium', timeStyle: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Set default tarikh & masa semasa borang dibuka
        function setDefaultDateTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('datetime').value = now.toISOString().slice(0, 16);
        }
        setDefaultDateTime();

        // Navigasi Tab
        function switchTab(tab) {
            if (tab === 'form') {
                document.getElementById('section-form').classList.remove('hidden');
                document.getElementById('section-list').classList.add('hidden');
                document.getElementById('nav-form').className = "flex-1 py-3 text-center font-medium text-sm border-b-2 border-blue-600 text-blue-600 transition";
                document.getElementById('nav-list').className = "flex-1 py-3 text-center font-medium text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition";
            } else {
                document.getElementById('section-form').classList.add('hidden');
                document.getElementById('section-list').classList.remove('hidden');
                document.getElementById('nav-list').className = "flex-1 py-3 text-center font-medium text-sm border-b-2 border-blue-600 text-blue-600 transition";
                document.getElementById('nav-form').className = "flex-1 py-3 text-center font-medium text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition";
                loadReports();
            }
        }

        // Setup Kanvas Tandatangan
        const canvas = document.getElementById('sigCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let hasSigned = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDraw);

        function startDraw(e) {
            isDrawing = true;
            hasSigned = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = '#1e3a8a';
            ctx.lineWidth = 2;
            ctx.stroke();
            e.preventDefault();
        }

        function stopDraw() { isDrawing = false; }

        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSigned = false;
        }

        // Pengurusan Gambar
        let uploadedImages = [];
        function handleImageUpload(e) {
            const files = e.target.files;
            const container = document.getElementById('imagePreviewContainer');
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImages.push(event.target.result);
                    renderImagePreviews();
                }
                reader.readAsDataURL(file);
            }
        }

        function renderImagePreviews() {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';
            uploadedImages.forEach((imgSrc, index) => {
                container.innerHTML += `
                    <div class="relative group aspect-square bg-slate-100 rounded-lg overflow-hidden border border-slate-200">
                        <img src="${imgSrc}" class="w-full h-full object-cover">
                        <button type="button" onclick="removeImage(${index})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow hover:bg-red-700">×</button>
                    </div>
                `;
            });
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderImagePreviews();
        }

        // Hantar Borang
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const newReport = {
                id: 'LPR-' + Date.now().toString().slice(-6),
                datetime: document.getElementById('datetime').value,
                officerId: document.getElementById('officerId').value,
                observation: document.getElementById('observation').value,
                images: [...uploadedImages],
                signature: hasSigned ? canvas.toDataURL() : null
            };

            let reports = JSON.parse(localStorage.getItem('pmk_reports') || '[]');
            reports.unshift(newReport);
            localStorage.setItem('pmk_reports', JSON.stringify(reports));

            alert('Laporan berjaya dihantar dan disimpan!');
            resetForm();
            updateBadgeCount();
        }

        function resetForm() {
            document.getElementById('reportForm').reset();
            setDefaultDateTime();
            clearSignature();
            uploadedImages = [];
            document.getElementById('imagePreviewContainer').innerHTML = '';
        }

        // Semak & Carian Laporan
        function updateBadgeCount() {
            let reports = JSON.parse(localStorage.getItem('pmk_reports') || '[]');
            document.getElementById('badge-count').innerText = reports.length;
        }
        updateBadgeCount();

        function loadReports() {
            let reports = JSON.parse(localStorage.getItem('pmk_reports') || '[]');
            displayReports(reports);
        }

        function displayReports(reports) {
            const container = document.getElementById('reportsContainer');
            if (reports.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">Tiada rekod laporan tersimpan.</div>`;
                return;
            }

            container.innerHTML = reports.map(rep => `
                <div onclick="viewDetail('${rep.id}')" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:border-blue-300 cursor-pointer transition space-y-2">
                    <div class="flex justify-between items-start">
                        <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">${rep.id}</span>
                        <span class="text-xs text-slate-500"><i class="fa-regular fa-clock mr-1"></i>${rep.datetime.replace('T', ' ')}</span>
                    </div>
                    <div class="text-xs text-slate-600 font-medium">Pegawai: ${rep.officerId}</div>
                    <p class="text-sm text-slate-700 line-clamp-2">${rep.observation}</p>
                    <div class="flex justify-between items-center text-xs text-slate-400 pt-1 border-t border-slate-100">
                        <span><i class="fa-solid fa-image mr-1"></i> ${rep.images.length} Gambar</span>
                        <span class="text-blue-600 font-medium">Tekan untuk detail &rarr;</span>
                    </div>
                </div>
            `).join('');
        }

        function filterReports() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            let reports = JSON.parse(localStorage.getItem('pmk_reports') || '[]');
            const filtered = reports.filter(rep => 
                rep.officerId.toLowerCase().includes(keyword) || 
                rep.datetime.toLowerCase().includes(keyword) ||
                rep.observation.toLowerCase().includes(keyword)
            );
            displayReports(filtered);
        }

        // Modal Paparan
        function viewDetail(id) {
            let reports = JSON.parse(localStorage.getItem('pmk_reports') || '[]');
            const rep = reports.find(r => r.id === id);
            if (!rep) return;

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div><strong>ID Laporan:</strong> ${rep.id}</div>
                <div><strong>Tarikh & Masa:</strong> ${rep.datetime.replace('T', ' ')}</div>
                <div><strong>No Pegawai:</strong> ${rep.officerId}</div>
                <div><strong>Catatan Pemerhatian:</strong><p class="bg-slate-50 p-2.5 rounded border mt-1 whitespace-pre-wrap">${rep.observation}</p></div>
                <div><strong>Bukti Gambar (${rep.images.length}):</strong>
                    <div class="grid grid-cols-3 gap-2 mt-1">
                        ${rep.images.map(img => `<img src="${img}" class="w-full h-20 object-cover rounded border">`).join('')}
                    </div>
                </div>
                <div><strong>Tandatangan Pegawai:</strong><br>
                    ${rep.signature ? `<img src="${rep.signature}" class="h-16 border rounded bg-slate-50 mt-1">` : '<span class="text-slate-400 text-xs">Tiada tandatangan</span>'}
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }
    </script>
</body>
</html>
